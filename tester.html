<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      .loader-block{
        height: 100vh;
        text-align: center;
        align-content: center;
     

      }
.loader {
  font-size: 100px;
  display: inline-block;
  /* font-family: Arial, Helvetica, sans-serif; */
  font-weight: bold;
  color: #00000015;
  box-sizing: border-box;
  text-shadow: 0 0 2px #FFF, 0 0 1px #FFF, 0 0 1px #FFF;
  letter-spacing: 2px;
  position: relative;
}
.loader::after {
  content: 'Wakaabout...';
  position: absolute;
  left: 0;
  top: 0;
  color: #f50000;
  width: 100%;
  height: 100%;
  overflow: hidden;
  box-sizing: border-box;
  animation: animloader 6s linear infinite;
}

@keyframes animloader {
  0% {
    width: 0%;
  }
  100% {
    width: 100%;
  }
}  
    </style>
    <title>Document</title>
</head>
<body>
    <div class="loader-block">
 <span class="loader">Wakaabout...</span>       
    </div>

</body>
</html>
